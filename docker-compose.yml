# ローカル開発用。本番(エックスサーバー共有レンタル)では Docker は使えない。
# 本番との差異があることを常に意識すること(CLAUDE.md 4章)。
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kyujin_app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APACHE_RUN_USER: "#1000"
      APACHE_RUN_GROUP: "#1000"

  mysql:
    image: mysql:8.0
    container_name: kyujin_mysql
    ports:
      # ローカルに MySQL が入っている場合に衝突しないよう 3307 を使う
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kyujin
      MYSQL_USER: kyujin
      MYSQL_PASSWORD: secret
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # メール確認用。http://localhost:8025 で受信箱を開く
  mailpit:
    image: axllent/mailpit:latest
    container_name: kyujin_mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # フロントのビルド用。本番の Xserver に Node.js はないため、
  # ビルドは必ずこのコンテナ(またはローカル)で行い public/build を配布する。
  node:
    image: node:22-alpine
    container_name: kyujin_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    # 常時起動はしない。`docker compose run --rm node npm run build` の形で使う
    profiles: ["tools"]
    command: ["sh"]

volumes:
  mysql_data:
