; エックスサーバーの実効値に合わせるための設定。
; T-01 の実機調査で本番の値が判明したら、この値を本番に揃えること。
; ローカルのほうが緩いと「ローカルで動くが本番で落ちる」実装を招く。

memory_limit = 256M
max_execution_time = 30
post_max_size = 20M
upload_max_filesize = 10M
max_input_vars = 1000

date.timezone = Asia/Tokyo
mbstring.language = Japanese

; 開発時はエラーを表示する(本番は APP_DEBUG=false で Laravel 側が制御する)
display_errors = On
error_reporting = E_ALL
