; エックスサーバーの実効値に合わせるための設定(2026-08-05 実機確認済み)。
; ローカルのほうが緩いと「ローカルで動くが本番で落ちる」実装を招く。

memory_limit = 1G
max_execution_time = 180
post_max_size = 1G
upload_max_filesize = 1G
max_input_vars = 1000

date.timezone = Asia/Tokyo
mbstring.language = Japanese

; 開発時はエラーを表示する(本番は APP_DEBUG=false で Laravel 側が制御する)
display_errors = On
error_reporting = E_ALL
