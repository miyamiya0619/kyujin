<?xml version="1.0" encoding="UTF-8"?>
<!--
  標準テーマの既定キービジュアル。

  顧客がサイト設定でキービジュアル(site_settings.key_visual_path)を
  アップロードすればそちらが使われる。これは未設定でもファーストビューが
  成立するようにするための同梱素材。

  写真ではなくベクターにしてある理由:
    - 権利関係が発生しない(配布パッケージなので全顧客の環境に複製される)
    - 実在しない人物の写真を「利用者」に見せかける形にならない
    - 数十 KB で済み、どの解像度でも劣化しない
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="高齢者に寄り添う介護スタッフのイラスト">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFAF3"/>
      <stop offset="1" stop-color="#FDF2E7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F0E8"/>
      <stop offset="1" stop-color="#D8E6DB"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="660" fill="url(#sky)"/>
  <circle cx="545" cy="300" r="268" fill="#FBE6D3" opacity=".55"/>
  <circle cx="775" cy="132" r="78" fill="#F7CE86" opacity=".5"/>

  <!-- 地面 -->
  <path d="M0 560 Q 300 512 640 548 Q 830 566 960 546 L960 660 L0 660 Z" fill="url(#ground)"/>
  <ellipse cx="470" cy="586" rx="250" ry="20" fill="#C9DCCD" opacity=".7"/>

  <!-- 背景の植栽 -->
  <g opacity=".85">
    <path d="M812 546 L812 470" stroke="#8FAE99" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="812" cy="440" rx="46" ry="52" fill="#A6C4AE"/>
    <ellipse cx="812" cy="424" rx="30" ry="34" fill="#BCD5C3"/>
  </g>

  <!-- ===================== 高齢者(杖をついて立つ) ===================== -->
  <g>
    <!-- 杖 -->
    <path d="M336 548 L344 400 Q 346 384 362 386" stroke="#C08E5E" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- 脚 -->
    <rect x="394" y="482" width="22" height="82" rx="11" fill="#96897E"/>
    <rect x="424" y="482" width="22" height="82" rx="11" fill="#8A7D72"/>
    <rect x="384" y="552" width="40" height="20" rx="10" fill="#5C5049"/>
    <rect x="416" y="552" width="40" height="20" rx="10" fill="#4F443E"/>

    <!-- 上衣(カーディガン) -->
    <path d="M374 326 Q 420 302 466 326 L482 494 Q 420 508 358 494 Z" fill="#F4E6D6"/>
    <path d="M420 308 L420 502" stroke="#E6D2BC" stroke-width="4"/>

    <!-- スカーフ -->
    <path d="M392 316 Q 420 336 448 316 Q 440 348 420 352 Q 400 348 392 316 Z" fill="#D9536F"/>

    <!-- 腕(左は杖を持ち、右は自然に下ろす) -->
    <path d="M378 342 Q 358 372 360 392" stroke="#F4E6D6" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="362" cy="394" r="13" fill="#F3C7A4"/>
    <path d="M462 344 Q 476 376 474 402" stroke="#F4E6D6" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="474" cy="406" r="13" fill="#F3C7A4"/>

    <!-- 頭 -->
    <circle cx="420" cy="256" r="46" fill="#F3C7A4"/>
    <path d="M374 254 Q 374 200 420 200 Q 466 200 466 254 Q 452 224 420 224 Q 388 224 374 254 Z" fill="#B9AFA6"/>
    <path d="M404 258 Q 410 252 416 258" stroke="#6B5A4E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M430 258 Q 436 252 442 258" stroke="#6B5A4E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M410 276 Q 421 286 434 275" stroke="#6B5A4E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="388" cy="272" r="8" fill="#F0A98C" opacity=".5"/>
    <circle cx="453" cy="272" r="8" fill="#F0A98C" opacity=".5"/>
  </g>

  <!-- ===================== 介護スタッフ(寄り添う) ===================== -->
  <g>
    <!-- 脚 -->
    <rect x="556" y="486" width="23" height="80" rx="11" fill="#5F7A6C"/>
    <rect x="587" y="486" width="23" height="80" rx="11" fill="#55705F"/>
    <rect x="546" y="554" width="42" height="20" rx="10" fill="#3F5147"/>
    <rect x="579" y="554" width="42" height="20" rx="10" fill="#374A3F"/>

    <!-- 上衣(白衣) -->
    <path d="M540 312 Q 583 290 626 312 L640 498 Q 583 512 526 498 Z" fill="#FFFFFF"/>
    <path d="M540 312 Q 583 290 626 312 L640 498 Q 583 512 526 498 Z" fill="none" stroke="#EADFD3" stroke-width="3"/>

    <!-- エプロン -->
    <path d="M556 344 Q 583 334 610 344 L620 494 Q 583 504 546 494 Z" fill="#7FA391"/>
    <path d="M562 344 Q 583 356 604 344" stroke="#6D9280" stroke-width="4" fill="none"/>

    <!-- 高齢者の肩へ添える腕(白衣が背景に埋もれないよう縁取りを重ねる) -->
    <path d="M550 336 Q 514 316 470 330" stroke="#EADFD3" stroke-width="29" stroke-linecap="round" fill="none"/>
    <path d="M550 336 Q 514 316 470 330" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="462" cy="331" r="14" fill="#F3C7A4"/>

    <!-- もう一方の腕 -->
    <path d="M624 340 Q 644 372 640 398" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" fill="none"/>
    <circle cx="639" cy="402" r="13" fill="#F3C7A4"/>

    <!-- 頭 -->
    <circle cx="583" cy="240" r="43" fill="#F3C7A4"/>
    <path d="M540 240 Q 540 188 583 188 Q 626 188 626 240 Q 614 212 583 212 Q 552 212 540 240 Z" fill="#4A3A30"/>
    <circle cx="583" cy="184" r="17" fill="#4A3A30"/>
    <path d="M568 242 Q 574 236 580 242" stroke="#3A2C24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M592 242 Q 598 236 604 242" stroke="#3A2C24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M574 260 Q 585 270 597 259" stroke="#3A2C24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="553" cy="256" r="8" fill="#F0A98C" opacity=".5"/>
    <circle cx="614" cy="256" r="8" fill="#F0A98C" opacity=".5"/>
  </g>

  <!-- 手前の鉢植え -->
  <g>
    <path d="M158 570 L212 570 L204 630 L166 630 Z" fill="#D98A5C"/>
    <rect x="152" y="558" width="66" height="16" rx="8" fill="#E89C6D"/>
    <path d="M185 558 L185 508" stroke="#8FAE99" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="163" cy="506" rx="24" ry="16" fill="#A6C4AE" transform="rotate(-24 163 506)"/>
    <ellipse cx="208" cy="500" rx="24" ry="16" fill="#BCD5C3" transform="rotate(22 208 500)"/>
    <ellipse cx="186" cy="478" rx="20" ry="14" fill="#A6C4AE"/>
  </g>

  <!-- 装飾 -->
  <circle cx="742" cy="330" r="10" fill="#F0B183" opacity=".7"/>
  <circle cx="786" cy="286" r="6" fill="#E8873F" opacity=".5"/>
  <circle cx="200" cy="220" r="12" fill="#F0B183" opacity=".55"/>
  <circle cx="248" cy="180" r="7" fill="#D9536F" opacity=".35"/>
</svg>
